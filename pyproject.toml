[project]
name = "bawaba"
version = "0.1.0"
description = "Bilingual (English/Arabic) service desk: Laya decides what an LLM may answer, Claude writes the answer"
requires-python = ">=3.11"
dependencies = [
    "laya>=0.4.32",
    "anthropic>=2.8",
    "lancedb>=0.41",
    "fastembed>=0.9",
    "pydantic>=2.10",
]

[project.optional-dependencies]
dev = ["pytest>=9"]

[project.scripts]
bawaba = "bawaba.__main__:main"

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["bawaba*"]
